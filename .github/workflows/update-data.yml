name: Update market data

on:
  schedule:
    # Weekdays ~5:15pm Chicago (after the close). GitHub cron is UTC.
    - cron: "15 22 * * 1-5"
  push:
    branches: [main]
    paths: ["data/tickers.json", "scripts/fetch_data.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices, filings, news
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/fetch_data.py
      - name: Commit market.json
        run: |
          git config user.name "stock-journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
