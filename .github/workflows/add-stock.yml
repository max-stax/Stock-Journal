name: Fetch newly added stocks

# Runs when data/tickers.json changes (e.g. "+ Add a stock" in the app) and fetches only
# the stocks that have no data yet, so they show up in about a minute.
on:
  push:
    branches: [main]
    paths: ["data/tickers.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-stock
  cancel-in-progress: false

jobs:
  fetch-new:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new stocks only
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_data.py --new-only
      - name: Save
        run: |
          git config user.name "stock-journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add data for new stocks $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
